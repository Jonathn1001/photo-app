name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  NEXTAUTH_SECRET: test-nextauth-secret-1234567890
  GOOGLE_CLIENT_ID: ci-stub
  GOOGLE_CLIENT_SECRET: ci-stub
  USER_SERVICE_URL: http://localhost:4001
  PHOTO_SERVICE_URL: http://localhost:4002
  INTERNAL_SERVICE_SECRET: test-internal-secret-1234

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r lint
      - run: pnpm -r typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: photoapp
          POSTGRES_PASSWORD: photoapp
          POSTGRES_DB: photoapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET }}
      INTERNAL_SERVICE_SECRET: test-internal-secret-1234
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      CLOUDINARY_UPLOAD_PRESET: test
      USER_SERVICE_URL: http://localhost:4001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: user-service migrate + test
        env:
          DATABASE_URL: postgresql://photoapp:photoapp@localhost:5432/photoapp?schema=users
        run: |
          pnpm --filter @photo-app/user-service prisma:deploy
          pnpm --filter @photo-app/user-service test
      - name: photo-service migrate + test
        env:
          DATABASE_URL: postgresql://photoapp:photoapp@localhost:5432/photoapp?schema=photos
        run: |
          pnpm --filter @photo-app/photo-service prisma:deploy
          pnpm --filter @photo-app/photo-service test

  openapi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @photo-app/user-service openapi:generate
      - run: pnpm --filter @photo-app/photo-service openapi:generate
      - run: git diff --exit-code services/*/openapi.json

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
