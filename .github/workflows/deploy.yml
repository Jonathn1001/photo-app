name: Deploy
on:
  push:
    branches: [main]

jobs:
  migrate-and-deploy-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run user-service migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_USERS }}
        run: pnpm --filter @photo-app/user-service prisma:deploy

      - name: Run photo-service migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_PHOTOS }}
        run: pnpm --filter @photo-app/photo-service prisma:deploy

      - name: Trigger Render redeploys
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_USER }}"
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PHOTO }}"
